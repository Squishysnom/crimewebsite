        <script lang="JavaScript">
            function createPage(name, price, img, page) { // creates product section

            var productPlacement = document.getElementById("productPage"); // grab little product section

            const productpg = document.createElement("div"); // creates the div for the product page
            productpg.classList.add("product"); // adds class

            const productbut = document.createElement("button"); // creates button
            productbut.style.border = "none"; // border looks bad, removes it
            productbut.style.outline = "none"; // border looks bad, removes it
            productbut.style.cursor = "pointer";

            // Make the button display the product name
            productbut.textContent = name;

            // Open the correct HTML page when clicked
            productbut.addEventListener('click', () => {
                window.open(`defaultData.html?page=${page}`, '_blank');  // opens new page with variables name, price and the image

            });

            const productdesc = document.createElement("div"); // creates the div for the product desc
            productdesc.classList.add('product_desc'); // adds class

            const header3product = document.createElement("h3"); // creates the h3
            const desc = document.createElement("p"); // creates the p
            const space = document.createElement("br");

            header3product.textContent = name; // adds the name
            desc.textContent = price; // adds the price

            productPlacement.appendChild(productpg);
            productpg.appendChild(productbut);
            productpg.appendChild(productdesc);
            productdesc.appendChild(header3product);
            productdesc.appendChild(desc);
            productdesc.appendChild(space);
            }

        </script>
